name: Validate

# Nothing checked this repository before 1.8.0: no HACS check, and the 24 test
# files in custom_components/config_auditor/tests were never run outside a
# developer's machine. That is how the 1.7.7 split-config fix reached a release
# having missed two functions.
#
# hassfest is deliberately NOT run here. It validates against the schema of a
# Home Assistant *core* integration, and H.A.C.A stores its own 16 groups of
# strings (panel, analyzer, ai_prompts, report, …) at the root of
# translations/<lang>.json — 97 KB of the 112 KB. Home Assistant ignores those
# keys at runtime; only hassfest's strict schema rejects them, and splitting the
# two stores apart is a refactor of the whole translation layer for no runtime
# gain. The four real defects hassfest did find on its single run (an invalid
# manifest `icon` key, four undeclared optional components, and eleven
# `supports_response` entries that services.yaml never reads) are fixed in the
# same commit that removed this job.

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a Home Assistant release that breaks the integration shows up
    # here rather than in a user's log.
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` is a default-store requirement that a custom repository
          # does not have to meet: it wants an entry in home-assistant/brands,
          # which is a pull request against a Home Assistant repository. The
          # `topics` check was un-ignored in 1.8.0 once the repository got its
          # GitHub topics, so it is a real check now.
          ignore: brands

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The suite imports the real homeassistant package (see
          # tests/conftest.py), and current Core releases require 3.14.
          python-version: "3.14"
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: python -m pytest custom_components/config_auditor/tests -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      # Configuration lives in ruff.toml: pyflakes only, and the tree is clean
      # against it. Widen the rule set there, never with a flag here.
      - run: ruff check --output-format=github .
